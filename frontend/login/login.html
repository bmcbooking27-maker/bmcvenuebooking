<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bharata Mata College</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/jpeg" href="../assets/logo/logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8f9fa; font-family: 'Montserrat', sans-serif; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); max-width: 400px; width: 90%; text-align: center; }
        .login-box h1 { font-size: 24px; margin-bottom: 8px; color: #1a202c; }
        .login-box p { color: #718096; margin-bottom: 24px; font-size: 14px; }
        .login-box .btn-primary-blue { width: 100%; padding: 12px; font-size: 15px; margin-top: 12px; }
        .login-box a { color: #1d4ed8; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 16px; }
        .login-box a:hover { text-decoration: underline; }
        .login-logo { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="../assets/logo/bmclogo.jpeg" alt="BMC Logo" class="login-logo">
        <h1>Welcome Back</h1>
        <p>Sign in to manage venue bookings</p>
        <p style="color: #a0aec0; font-style: italic;">Login feature coming soon.</p>
        <a href="../index.html">← Back to Home</a>
    </div>
</body>
</html>
